[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "wrfagent"
version = "0.1.0.dev0"
description = "WRF configuration fidelity: start-up check audit, specification checks and deterministic namelist generation (preview)"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [{name = "WRF-Agent Team"}]
keywords = ["wrf", "namelist", "configuration", "reproducibility", "workflow"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Atmospheric Science",
    "Programming Language :: Python :: 3",
]
dependencies = ["pyyaml>=6.0"]

[project.optional-dependencies]
test = ["pytest>=7"]

[tool.setuptools.packages.find]
include = ["src", "src.*"]
namespaces = true

[tool.setuptools.package-data]
"*" = ["*.json", "*.md", "*.yaml"]
