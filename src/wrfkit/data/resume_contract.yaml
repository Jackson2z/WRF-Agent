# resume_contract.yaml — contract for resuming a run on another machine (v1.0)
# Defines the six required files, the integrity checks, known pitfalls and the acceptance gate (generic; a case may override thresholds)
# Used by the five resume steps: resume-pack / fetch / preflight / watch / accept
# Derived from two resumed production runs (2026-08)
# Principle: resume.py holds only the mechanism; every list and threshold is read from this file

contract_version: "1.0"
date_frozen: 2026-08-26

# ---- the six required files (preflight blocks if any is missing) ----
required_pieces:
  wrfrst_d01: {desc: "d01 restart state", from: run_dir, critical: true}
  wrfrst_d02: {desc: "d02 restart state", from: run_dir, critical: true}
  wrfrst_d03: {desc: "d03 restart state", from: run_dir, critical: true}
  wrfbdy_d01: {desc: "lateral boundary conditions (independent of the scenario)", from: "run_dir or a symlink to wps_dir", critical: true,
               note: "missing -> FATAL med_latbound_in IERR=-1021 on the target machine"}
  namelist_input: {desc: "with restart=.true. and the resumed window", from: run_dir, critical: true}
  urbparm: {desc: "urban parameter table of the scenario", from: "roof_pv copy in the run directory -> current table -> roof_pv copy in the parent", critical: true,
            probe_chain: ["URBPARM.TBL.roof_pv", "URBPARM.TBL", "../URBPARM.TBL.roof_pv"]}

# ---- transfer integrity ----
integrity:
  size_check: true          # byte-level size comparison (guards against truncated object-store downloads; a wrfrst short by 1405 B gives netCDF Errno -51)
  md5_spotcheck_n: 2        # number of files spot-checked by md5 during resume-fetch
  s3_truncate_min_bytes: 1024

# ---- assembly on the target machine ----
staging:
  runtime_datalinks_from: "symlink the run-time tables from the WRF install run directory (except URBPARM.TBL, which belongs to the scenario)"
  urbparm_scenario_rule: "scen=roof_pv and no current table -> use URBPARM.TBL.roof_pv"
  bdy_end_rule: "last boundary time = end - 6 h; if it is short, re-run real.exe (never resume blindly)"

# ---- acceptance gate (resume-watch / accept) ----
acceptance:
  frames_expected: 577            # whole window (original and resumed segments combined)
  interval_minutes: 20
  grid_continuity: true           # 20-min output grid has no gaps (after overlapping frames are removed)
  overlap_dedup: "frames where the resumed and original segments overlap are split at the restart time"
  window_check: "first frame = window_start, last frame = window_end"
  success_marker: "SUCCESS COMPLETE WRF"

# ---- known pitfalls (matched during preflight) ----
pitfalls:
  - {id: pit1, pattern: "Errno -51|netCDF error", cause: "truncated download", fix: "transfer the file again; size_check catches it"}
  - {id: pit2, pattern: "IERR=-1021|med_latbound_in", cause: "wrfbdy_d01 missing", fix: "add wrfbdy_d01 from the six required files"}
  - {id: pit3, pattern: "boundary time too short", cause: "last boundary time < end - 6 h", fix: "re-run real.exe (do not resume directly)"}
  - {id: pit4, pattern: "urban parameter drift", cause: "URBPARM table of the wrong scenario", fix: "re-select with probe_chain and confirm with diff"}
