# physics_compat.yaml — compatibility rules for physics scheme combinations (namelist_gate rule set #1)
# Origin: a batch in which bl_pbl_physics was switched from MYJ (2) to YSU (1) while sf_sfclay_physics
#       stayed at 2; WRF stopped with FATAL "Use sf_sfclay_physics=1 or 91 for this pbl option",
#       and all three cases exited immediately (frames=0). Lesson: check combinations statically before submission.
# Used by: wrf_kit/namelist_gate.py (generic engine), called from preflight Q0 through a compatibility wrapper.
# Urban scheme constraints (advisory, not a hard WRF stop):
#   sf_urban_physics=3 (BEP+BEM) is conventionally paired with local closure; a non-local PBL (YSU) needs a physical justification and a declaration
#   — see the unknown nonlocal_PBL_family.

rules_version: "1.0"
date_frozen: "2026-09-14"
source_event: "ysu_sfclay_mismatch_20260913"

rules:
  - id: pbl_sfclay_compat
    description: "the PBL scheme requires a compatible surface-layer scheme (bl -> sf matrix)"
    severity: FAIL
    check:
      type: membership
      when_key: bl_pbl_physics
      then_key: sf_sfclay_physics
      allowed:
        1:  [1, 91]    # YSU
        2:  [2]        # MYJ
        4:  [4]        # QNSE
        5:  [1, 5]     # MYNN2.5
        8:  [1, 91]    # BouLac (sf=1 confirmed in a run)
        12: [1, 91]    # Shin-Hong
