metadata:
  source: WRF / WPS namelist defaults (public preview variant)
  extracted: 2026-06-09
  description: WRF namelist.wps and namelist.input template fragments for domain generation

namelist_wps:
  description: "WPS namelist template (namelist.wps)"
  sections:
    share:
      wrf_core: ARW
      max_dom: "{max_dom}"
      start_date: "{start_date}"
      end_date: "{end_date}"
      interval_seconds: 21600
      io_form_geogrid: 2
    geogrid:
      parent_id: "{parent_id}"
      parent_grid_ratio: "{parent_grid_ratio}"
      i_parent_start: "{i_parent_start}"
      j_parent_start: "{j_parent_start}"
      e_we: "{e_we}"
      e_sn: "{e_sn}"
      geog_data_res: default
      dx: "{dx}"
      dy: "{dy}"
      map_proj: "{map_proj}"
      ref_lat: "{ref_lat}"
      ref_lon: "{ref_lon}"
      truelat1: "{truelat1}"
      truelat2: "{truelat2}"
      stand_lon: "{stand_lon}"
      geog_data_path: ./WPS_GEOG   # set to your static geography directory

namelist_input:
  description: "WRF input namelist template (namelist.input) — key sections"
  sections:
    time_control:
      run_days: 0
      run_hours: 24
      start_year: "{start_year}"
      start_month: "{start_month}"
      start_day: "{start_day}"
      start_hour: "{start_hour}"
      start_minute: 0
      start_second: 0
      end_year: "{end_year}"
      end_month: "{end_month}"
      end_day: "{end_day}"
      end_hour: "{end_hour}"
      end_minute: 0
      end_second: 0
      interval_seconds: 21600
      input_from_file: ".true."
      history_interval: 60
      frames_per_outfile: 1000
      restart: ".false."
      restart_interval: 1440
      io_form_history: 2
      io_form_restart: 2
      io_form_input: 2
      io_form_boundary: 2
      debug_level: 0

    domains:
      time_step: 30
      max_dom: "{max_dom}"
      e_we: "{e_we}"
      e_sn: "{e_sn}"
      e_vert: 45
      dzstretch_s: 1.1
      p_top_requested: 5000
      num_metgrid_levels: 38
      num_metgrid_soil_levels: 4
      dx: "{dx}"
      dy: "{dy}"
      grid_id: "{grid_id}"
      parent_id: "{parent_id}"
      i_parent_start: "{i_parent_start}"
      j_parent_start: "{j_parent_start}"
      parent_grid_ratio: "{parent_grid_ratio}"
      parent_time_step_ratio: "{parent_time_step_ratio}"
      feedback: 1
      smooth_option: 0
      # MPI / IO concurrency (written by real namelists; the template used to lack these keys)
      nproc_x: -1
      nproc_y: -1
      nio_groups: 1
      nio_tasks_per_group: 0
      iofields_filename: "\"\""
      ignore_iofields_warning: ".true."

    physics:
      mp_physics: 8
      cu_physics: "{cu_physics}"
      ra_lw_physics: 4
      ra_sw_physics: 4
      bl_pbl_physics: 2
      sf_sfclay_physics: 2
      sf_surface_physics: 2
      sf_urban_physics: 3
      radt: "{radt}"
      bldt: 0
      cudt: 5
      num_soil_layers: 4
      num_land_cat: 21
      # physics switches (written by real namelists; the template used to lack these keys)
      isfflx: 1
      icloud: 1
      ifsnow: 0

    dynamics:
      hybrid_opt: 2
      w_damping: 1
      diff_opt: 2
      km_opt: 4
      diff_6th_opt: 0
      diff_6th_factor: 0.12
      base_temp: 290.0
      damp_opt: 3
      zdamp: 5000.0
      dampcoef: 0.2
      khdif: 0
      kvdif: 0
      non_hydrostatic: ".true."
      moist_adv_opt: 1
      scalar_adv_opt: 1
      gwd_opt: "{gwd_opt}"

    bdy_control:
      spec_bdy_width: 5
      spec_zone: 1
      relax_zone: 4
      specified: "{specified}"
      nested: "{nested}"

scenarios:
  basic_2domain:
    description: "Basic 2-domain configuration (dx=5km/1km)"
    max_dom: 2
    dx: [5000, 1000]
    dy: [5000, 1000]
    parent_grid_ratio: [1, 5]
    e_we: [100, 121]
    e_sn: [100, 121]
    parent_id_wps: [1, 1]
    parent_id_wrf: [0, 1]
    i_parent_start: [1, 40]
    j_parent_start: [1, 40]
    time_step: 30
    cu_physics: [1, 0]
    radt: [5, 1]
    gwd_opt: [1, 0]
    specified: [".true.", ".false."]
    nested: [".false.", ".true."]

  urban_1domain:
    description: "Single domain urban study (dx=1km)"
    max_dom: 1
    dx: [1000]
    dy: [1000]
    parent_grid_ratio: [1]
    e_we: [200]
    e_sn: [200]
    parent_id_wps: [1]
    parent_id_wrf: [0]
    time_step: 5
    cu_physics: [0]
    radt: [1]
    gwd_opt: [0]
    specified: [".true."]
    nested: [".false."]
