# axis_rules.yaml — submission gate for a 15-axis urban design space
# Used by: wrf_kit/namelist_gate.py (generic engine)
# Axis definitions follow the design-space registry of the study
# Levels: FAIL = blocks submission · WARN = must be declared · INFO = deferred axis (recorded, not blocked)
# Physical range rules (0-1 and so on) block invalid values; experimental levels (such as four albedo levels) are design choices and are not blocked.

source: namelist   # primary target = namelist.input; URBPARM axes are under source: urbparm_table

rules:
  # ── namelist.input axes ──
  - id: axis6_evert
    description: "axis 6 e_vert vertical levels: allowed 45/60 (verified) and 51 (used in a production case)"
    severity: FAIL
    check:
      type: membership
      when_key: e_vert
      then_key: e_vert          # self-mapping: the value must be in the allowed set (validator special case: when allowed is a flat list, e_vert itself is checked)
      allowed:
        45: [45]
        51: [51]               # e_vert = 51 (checked against a real namelist; previously skipped silently)
        60: [60]
  - id: axis7_dx_d03
    description: "axis 7 d03 resolution: 1 km by default (500 m is a special case and must be declared)"
    severity: WARN
    check:
      type: range
      key: dx                   # dx is per domain; parse takes the first value (d01); the d03 check is noted in the urbparm section
      min: 100
      max: 10000
  - id: axis9_pbl_sfclay
    description: "axis 9 compatible PBL and surface-layer combination"
    severity: FAIL
    check:
      type: membership
      when_key: bl_pbl_physics
      then_key: sf_sfclay_physics
      allowed:
        1:  [1, 91]
        2:  [2]
        5:  [1, 5]
        8:  [1, 91]
        12: [1, 91]

  # ── URBPARM.TBL axes (engine source=urbparm_table) ──
  - id: axis1_albr_roof
    description: "axis 1 roof albedo: physical range [0,1]"
    severity: FAIL
    source: urbparm_table
    parse_file: URBPARM.TBL
    check: {type: range, key: ALBR, min: 0.0, max: 1.0}
  - id: axis2_albr_wall
    description: "axis 2 wall albedo: physical range [0,1]"
    severity: FAIL
    source: urbparm_table
    parse_file: URBPARM.TBL
    check: {type: range, key: ALBB, min: 0.0, max: 1.0}
  - id: axis3_pv_frac
    description: "axis 3 PV_FRAC coverage: physical range [0,1]"
    severity: FAIL
    source: urbparm_table
    parse_file: URBPARM.TBL
    check: {type: range, key: PV_FRAC_ROOF, min: 0.0, max: 1.0}

  # ── deferred axes (source-code level; INFO, recorded not blocked — when enabled, raise to FAIL and add parse_file for the source parameter) ──
  - id: axis11_eta_pv
    description: "axis 11 PV efficiency eta_PV (source effpv=0.19; compile-time, deferred)"
    severity: INFO
    check: {type: required, keys: []}
  - id: axis12_alpha_pv
    description: "axis 12 PV panel albedo alpha_PV (source albpv=0.11; compile-time, deferred)"
    severity: INFO
    check: {type: required, keys: []}
  - id: axis13_gap
    description: "axis 13 mounting gap (not parameterised in the source; deferred)"
    severity: INFO
    check: {type: required, keys: []}
  - id: axis14_gamma
    description: "axis 14 temperature coefficient gamma (source 0.005; deferred)"
    severity: INFO
    check: {type: required, keys: []}
