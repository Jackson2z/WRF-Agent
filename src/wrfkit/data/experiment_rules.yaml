metadata:
  source: >-
    DOE/sensitivity baseline-consistency
    (lesson from a 2026-07-28 sensitivity design in which an 11-class URBPARM table was used by mistake
    and ALBR, AH and other keys drifted silently)
  description: >-
    configuration consistency of sensitivity runs against the baseline, a hard check before sbatch.

experiment_config_consistency:
  severity: CRITICAL
  urbparm:
    description: >-
      URBPARM.TBL may differ only in the experimental variables; everything else must match the baseline.
      Prevents the 3-class WRF URBPARM.TBL being replaced by an 11-class LCZ table
      with ALBR/AH and the rest drifting silently.
    allowed_drift_keys: [ALBR, ALBB]
    must_match_others: true
    must_match_num_categories: true
  namelist:
    description: >-
      namelist physics/domain settings must match the baseline exactly.
    must_match_sections:
      physics:
        - sf_urban_physics
        - bl_pbl_physics
        - mp_physics
        - ra_lw_physics
        - ra_sw_physics
        - sf_surface_physics
        - cu_physics
      domains:
        - max_dom
        - e_we
        - e_sn
        - dx
        - dy
        - parent_grid_ratio
        - i_parent_start
        - j_parent_start
        - num_tiles
      time_control:
        - run_days
        - run_hours
        - start_year
        - start_month
        - start_day
        - start_hour
        - end_year
        - end_month
        - end_day
        - end_hour
