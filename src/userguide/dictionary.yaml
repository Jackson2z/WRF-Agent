# Dictionary: the single source of every human-readable string in the parameter form (English base; add a language by dropping dictionary.<lang>.yaml next to this file (overlay wins, no code changes)).
# Sections:
#   ui      interface strings ({version}, {n} are placeholders)
#   groups  group titles (ids from field_map.yaml)
#   rules   compile-rule descriptions (ids shared with field_map.yaml and the compiler)
#   sources non-field derivation sources (e.g. forcing_dataset)
#   fields  <file>:<field> -> label / question / note / options{value: label}
# Option labels may be omitted: the renderer falls back to the Users' Guide wording.
